[package]
name = "nyaa-actix"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nyaa-actix"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-session = { version = "0.9", features = ["cookie-session"] }
actix-identity = "0.7"
actix-multipart = "0.7"
actix-files = "0.6"

diesel = { version = "2", features = ["sqlite", "chrono", "r2d2"] }
diesel_migrations = "2"
r2d2 = "0.8"
# Compile SQLite from source so Windows (MSVC) builds don't need a system sqlite3.lib.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
sha1 = "0.10"
hex = "0.4"
thiserror = "1"
anyhow = "1"
validator = { version = "0.18", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
rand = "0.8"
bytes = "1"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
urlencoding = "2"
percent-encoding = "2"
bitflags = "2"
socket2 = "0.6"
# Meilisearch speaks plain JSON over HTTP; a small blocking client is all it needs.
# No gzip: Meilisearch then sends a compressed reply's headers and body in separate packets,
# and on a reused connection the body waited ~40 ms for a delayed ACK.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

# Optimize dependencies even in debug builds: argon2 (login, register) and Tera rendering
# are many times slower unoptimized. Only the first debug build pays for it; this crate
# itself stays unoptimized, so rebuilds after a change are as fast as before.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
