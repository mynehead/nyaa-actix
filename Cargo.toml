[package]
name = "nyaa-actix"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nyaa-actix"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-session = { version = "0.9", features = ["cookie-session"] }
actix-multipart = "0.7"
actix-files = "0.6"

diesel = { version = "2", features = ["sqlite", "postgres", "chrono", "r2d2"] }
diesel_migrations = { version = "2", features = ["sqlite", "postgres"] }
# Compile SQLite from source so Windows (MSVC) builds don't need a system sqlite3.lib.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
sha1 = "0.10"
hex = "0.4"
# HTTP Basic auth on the JSON API
base64 = "0.22"
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
bytes = "1"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
urlencoding = "2"
percent-encoding = "2"
bitflags = { version = "2", features = ["serde"] }
socket2 = "0.6"
# Meilisearch speaks plain JSON over HTTP; a small blocking client is all it needs.
# No gzip: Meilisearch then sends a compressed reply's headers and body in separate packets,
# and on a reused connection the body waited ~40 ms for a delayed ACK.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# Avatar uploads: decode, then scale and crop to 256x256 PNG
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Gravatar URLs (ENABLE_GRAVATAR) are keyed by the MD5 of the email
md5 = { package = "md-5", version = "0.10" }
# File storage (torrent info dicts, avatars): local disk or any S3-compatible service.
# TLS uses ring rather than aws-lc-rs, so Windows (MSVC) builds need no CMake or NASM.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Optimize dependencies even in debug builds: argon2 (login, register) and Tera rendering
# are many times slower unoptimized. Only the first debug build pays for it; this crate
# itself stays unoptimized, so rebuilds after a change are as fast as before.
# Compile libpq from source too, so no PostgreSQL install is needed to build. Windows leaves
# out OpenSSL, which MSVC can't build without Perl and NASM: connections from there are
# plain (fine for a local dev database); Linux and macOS builds can use sslmode=require.
[target.'cfg(windows)'.dependencies]
pq-sys = { version = "0.7", features = ["bundled_without_openssl"] }

[target.'cfg(not(windows))'.dependencies]
pq-sys = { version = "0.7", features = ["bundled"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
