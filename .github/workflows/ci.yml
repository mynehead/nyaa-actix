name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # For the Meilisearch round-trip test (docs/meilisearch.md)
      meilisearch:
        image: getmeili/meilisearch:v1.54
        env:
          MEILI_MASTER_KEY: ci-master-key-1234567890
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
      # For the one test that runs the Postgres migrations and queries; the rest use SQLite
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      # Not a service container: the image's own entrypoint has CRLF line endings (see compose.yml)
      - name: Start torrust-actix
        run: |
          docker run -d --name tracker -p 6969:6969 -p 8080:8080 \
            -e TRACKER__API_KEY=ci-tracker-key -e TRACKER__WHITELIST_ENABLED=true \
            -e DATABASE__PERSISTENT=false -e DATABASE__ENGINE=sqlite3 -e "DATABASE__PATH=sqlite://:memory:" \
            -w /app/torrust-actix/target/release power2all/torrust-actix:v4.2.23 \
            /bin/sh -c '[ -f config.toml ] || ./torrust-actix --create-config; exec ./torrust-actix'
          for i in $(seq 30); do
            curl -fsS -o /dev/null -H "Authorization: Bearer ci-tracker-key" http://127.0.0.1:8080/stats && exit 0
            sleep 1
          done
          docker logs tracker; exit 1
      - name: Test
        run: cargo test --locked
        env:
          TRACKER_TEST_URL: http://127.0.0.1:8080
          TRACKER_TEST_KEY: ci-tracker-key
          TRACKER_TEST_ANNOUNCE_URL: http://127.0.0.1:6969/announce
          MEILI_TEST_URL: http://127.0.0.1:7700
          MEILI_TEST_KEY: ci-master-key-1234567890
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/nyaa_test

  # The owner builds on Windows (MSVC), where bundled SQLite and libpq are compiled from source
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked

  # The storage tests again, against a real S3-compatible server (Garage, see docker/)
  s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Garage
        run: |
          docker compose -f docker/compose.yml up -d garage
          docker/garage/init.sh
      - name: Test storage against Garage
        env:
          NYAA_TEST_S3_ENDPOINT: http://localhost:3900
          NYAA_TEST_S3_BUCKET: nyaa
          NYAA_TEST_S3_REGION: garage
          NYAA_TEST_S3_PATH_STYLE: "true"
          NYAA_TEST_S3_ACCESS_KEY: GK0123456789abcdef01234567
          NYAA_TEST_S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: cargo test --locked "storage::"

  # Keeps the Dockerfile building (docker/DEPLOY.md)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nyaa-actix .
      - name: Check compose file
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci TRACKER_API_KEY=ci docker compose --profile search config --quiet
