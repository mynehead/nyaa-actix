<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Down for maintenance</title>
<!-- Self-contained on purpose: a reverse proxy serves this file while the site is stopped,
     so nothing else under /static can be loaded. The site serves it too during
     MAINTENANCE_MODE_OFFLINE, with MAINTENANCE_MODE_MESSAGE in place of the paragraph. -->
<style>
  :root { color-scheme: light dark; --bg: #f5f5f5; --card: #fff; --text: #333; --muted: #777; --accent: #337ab7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1c; --card: #262626; --text: #e0e0e0; --muted: #999; --accent: #5aa0e0; }
  }
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 32em; margin: 16px; padding: 2em; background: var(--card); border-top: 4px solid var(--accent);
         border-radius: 4px; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); text-align: center; }
  h1 { margin: 0 0 .5em; font-size: 1.6em; font-weight: 500; }
  p { margin: 0 0 1em; }
  .note { margin: 0; color: var(--muted); font-size: .9em; }
</style>
</head>
<body>
<main>
  <h1>Down for maintenance</h1>
  <p class="message">We are doing some maintenance and will be back shortly.</p>
  <p class="note">Torrents already in your client keep downloading. Please try again in a few minutes.</p>
</main>
</body>
</html>
