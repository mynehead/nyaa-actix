{% for msg in flash_messages | default(value=[]) %}
<div class="alert alert-dismissable alert-{{ msg.category }}" role="alert">
	<button type="button" class="close" data-dismiss="alert">&times;</button>
	{% if msg.strong %}<strong>{{ msg.strong }}</strong>{% if msg.text %} {% endif %}{% endif %}{{ msg.text }}
</div>
{% endfor %}
